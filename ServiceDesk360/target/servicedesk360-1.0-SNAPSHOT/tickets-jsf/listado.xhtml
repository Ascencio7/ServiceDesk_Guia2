<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <meta charset="UTF-8" />
    <title>Tickets | ServiceDesk 360</title>
    <h:outputStylesheet library="css" name="estilos.css" />
</h:head>
<h:body>
    <header class="encabezado">
        <h1>Tickets</h1>
        <p>Vista de solo lectura que reutiliza TicketDetalleDTO y la consulta JOIN.</p>
    </header>
    <main class="contenedor">
        <h:messages globalOnly="true" layout="list" />
        <h:link outcome="/index.xhtml" value="Inicio" />
        <h:panelGroup layout="block" rendered="#{empty ticketBean.tickets}">
            <p>No hay tickets para mostrar.</p>
        </h:panelGroup>
        <h:dataTable value="#{ticketBean.tickets}" var="t"
                     rendered="#{not empty ticketBean.tickets}">
            <h:column>
                <f:facet name="header">ID</f:facet>
                <h:outputText value="#{t.idTicket}" />
            </h:column>
            <h:column>
                <f:facet name="header">Título</f:facet>
                <h:outputText value="#{t.titulo}" />
            </h:column>
            <h:column>
                <f:facet name="header">Cliente</f:facet>
                <h:outputText value="#{t.cliente}" />
            </h:column>
            <h:column>
                <f:facet name="header">Equipo</f:facet>
                <h:outputText value="#{t.equipo}" />
            </h:column>
            <h:column>
                <f:facet name="header">Categoría</f:facet>
                <h:outputText value="#{t.categoria}" />
            </h:column>
            <h:column>
                <f:facet name="header">Técnico</f:facet>
                <h:outputText value="#{t.tecnico}" />
            </h:column>
            <h:column>
                <f:facet name="header">Prioridad</f:facet>
                <h:outputText value="#{t.prioridad}" />
            </h:column>
            <h:column>
                <f:facet name="header">Estado</f:facet>
                <h:outputText value="#{t.estado}" />
            </h:column>
        </h:dataTable>
    </main>
</h:body>
</html>
